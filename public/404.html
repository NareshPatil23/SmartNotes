<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | SmartNotes AI</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 3.5rem; margin: 0 0 0.5rem; color: #818cf8; font-weight: 800; }
    h2 { font-size: 1.5rem; margin: 0 0 1rem; font-weight: 700; }
    p { color: #94a3b8; font-size: 1rem; line-height: 1.5; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: #6366f1;
      color: #ffffff;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    a:hover, a:focus {
      background: #4f46e5;
      outline: 2px solid #818cf8;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/">← Return to SmartNotes AI</a>
  </div>
</body>
</html>
